# Example configuration for the OPC PLC Gateway.
# Copy this file to gateway.yaml next to the .exe (or pass -config <path>)
# and edit it for your factory's devices.
#
# You don't have to hand-edit this file: the built-in web dashboard
# (http://127.0.0.1:8080 by default, opens automatically when you run the
# .exe) can add/remove devices and tags for you and writes the result back
# here. This file is shown as a reference for what the dashboard produces,
# and as a starting point if you'd rather script your device list.
# gateway.yaml can even start as just `devices: []` and be built up
# entirely from the dashboard.

server:
  # Interface to bind the OPC UA endpoint to. 0.0.0.0 = all interfaces.
  opcua_bind_addr: "0.0.0.0"
  opcua_port: 4840

webui:
  # The dashboard binds to localhost only by default - safe out of the
  # box. Set to "0.0.0.0" to reach it from other machines on the factory
  # LAN (e.g. a supervisor's desk), same as you would with Kepware's
  # configuration tool.
  bind_addr: "127.0.0.1"
  port: 8080
  # open_browser: false   # uncomment to stop the .exe from auto-opening a browser tab

devices:
  # --- Rockwell / Allen-Bradley (ControlLogix, CompactLogix, Micro8xx) ---
  - name: "Linha1_CompactLogix"
    driver: "rockwell"
    address: "192.168.1.10"
    poll_interval_ms: 500
    tags:
      - name: "Velocidade"
        address: "Program:MainProgram.Velocidade"
      - name: "StatusMaquina"
        address: "Program:MainProgram.Status"
      - name: "ContadorPecas"
        address: "Local:1:I.Data[0]"

  # --- Siemens (S7-300/400/1200/1500) ---
  # S7-1200/1500: the polled DBs must have "Optimized block access"
  # UNCHECKED in TIA Portal, otherwise byte offsets are unstable.
  - name: "Linha2_S71500"
    driver: "siemens"
    address: "192.168.1.20"
    rack: 0
    slot: 1
    poll_interval_ms: 500
    tags:
      - name: "Temperatura"
        address: "DB10,REAL0"
      - name: "Pressao"
        address: "DB10,REAL4"
      - name: "EmFalha"
        address: "DB10,X8.0"

  # --- Mitsubishi Electric (Q/L/iQ-R series with an Ethernet port) ---
  - name: "Linha4_MitsubishiQ"
    driver: "mitsubishi"
    address: "192.168.1.40:5007" # MC protocol port set in GX Works
    poll_interval_ms: 500
    tags:
      - name: "Temperatura"
        address: "D100"
        type: "float32"
      - name: "EmFalha"
        address: "M20"

  # --- Any other brand that speaks Modbus TCP (Schneider, ABB, Omron,
  #     Delta, WEG, most VFDs and remote I/O modules) ---
  - name: "Linha3_ModbusGenerico"
    driver: "modbus"
    address: "192.168.1.30:502"
    unit_id: 1
    poll_interval_ms: 1000
    tags:
      - name: "NivelTanque"
        address: "HR:100"
        type: "float32"
      - name: "BombaLigada"
        address: "COIL:5"
